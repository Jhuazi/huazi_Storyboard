<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="1310" fill="#F8FAFC"/>
  <text x="340" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">huazi_Storyboard 技能使用流程图</text>
  <text x="340" y="66" text-anchor="middle" font-size="13" fill="#64748B">五平台适配 · 本图默认豆包主路径，其他平台差异见 references/tool-adaptation.md</text>

  <!-- 1 触发 -->
  <rect x="80" y="88" width="520" height="56" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="340" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#3730A3">① 触发技能</text>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#475569">对智能体说「给《XX》做分镜图」｜输入：章节正文 / 大纲 / 剧本（任一即可）</text>
  <line x1="340" y1="144" x2="340" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 平台确认 -->
  <rect x="80" y="162" width="520" height="64" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="340" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#854D0E">② 平台确认（强制：未指明平台必须先询问）</text>
  <text x="340" y="206" text-anchor="middle" font-size="12" fill="#475569">豆包（默认主推）/ 即梦 / RunningHub / LiblibAI / 本地 ComfyUI，或其他</text>
  <text x="340" y="222" text-anchor="middle" font-size="11" fill="#A16207">各平台挂载数·拼版·视频语法差异大，问清后才产出对应格式提示词</text>
  <line x1="340" y1="226" x2="340" y2="242" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 骨架 -->
  <rect x="80" y="244" width="520" height="50" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="340" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">③ 自动创建项目骨架</text>
  <text x="340" y="284" text-anchor="middle" font-size="12" fill="#64748B">{名称}分镜图设定/ 文件夹，含 00-05 六个工作文件</text>
  <line x1="340" y1="294" x2="340" y2="310" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 资产出图 -->
  <rect x="80" y="312" width="520" height="96" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="340" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">④ 资产出图（00 文件 · 提示词投喂所选平台）</text>
  <text x="340" y="358" text-anchor="middle" font-size="12" fill="#475569">主视角设定图 → 俯视图 → 反打/补充视角 → 人物四视图 ×N</text>
  <text x="340" y="378" text-anchor="middle" font-size="11.5" fill="#B45309">豆包对话直接生图 · 参考图 10-14 张 · 俯视图必做（座位锚）</text>
  <text x="340" y="396" text-anchor="middle" font-size="11.5" fill="#B45309">LiblibAI 可训练角色 LoRA 锁一致性 · 大字号短文字可尝试直出</text>
  <line x1="340" y1="408" x2="340" y2="424" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5 规则+shot表 -->
  <rect x="80" y="426" width="520" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="340" y="448" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">⑤ 空间宪法与镜头表（智能体产出 · 用户核对）</text>
  <text x="340" y="468" text-anchor="middle" font-size="12" fill="#64748B">01 物理规则总表（尺寸/站位/人数/朝向） ＋ 02 分镜总表 shot 表</text>
  <line x1="340" y1="482" x2="340" y2="500" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6 分镜生成 -->
  <rect x="80" y="502" width="520" height="72" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="340" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#155E75">⑥ 分镜图生成（03 文件）</text>
  <text x="340" y="548" text-anchor="middle" font-size="12" fill="#475569">豆包/LiblibAI：组图模式一次 4 张连贯独立图，拼版省略</text>
  <text x="340" y="566" text-anchor="middle" font-size="11.5" fill="#0E7490">RunningHub/ComfyUI：四宫格 → 裁剪 → 九宫格拼版（必做）</text>
  <line x1="340" y1="574" x2="340" y2="594" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7 验收 diamond -->
  <polygon points="340,596 560,672 340,748 120,672" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="340" y="664" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">⑦ 04 文件验收通过？</text>
  <text x="340" y="686" text-anchor="middle" font-size="11.5" fill="#4D7C0F">人数对 · 位置对 · 大小对 · 结构对</text>
  <text x="340" y="704" text-anchor="middle" font-size="11.5" fill="#4D7C0F">无字幕 · 虚化人群无正脸</text>
  <path d="M 560 672 C 630 672 640 606 600 556" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="628" y="618" text-anchor="middle" font-size="11" fill="#DC2626">否：改物理规则重生成</text>
  <text x="628" y="634" text-anchor="middle" font-size="11" fill="#DC2626">或平台内局部重绘/对话改图</text>
  <line x1="340" y1="748" x2="340" y2="766" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="354" y="762" font-size="11" fill="#16A34A">是</text>

  <!-- 8 视频提示词 -->
  <rect x="80" y="768" width="520" height="72" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="340" y="792" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">⑧ 视频提示词（05 文件 · 五锁结构 → 平台语法）</text>
  <text x="340" y="814" text-anchor="middle" font-size="12" fill="#475569">[REFERENCE LOCK]→@图片N 标注身份 ｜ [PHYSICAL LOCK]→压缩为总述句</text>
  <text x="340" y="832" text-anchor="middle" font-size="11.5" fill="#6D28D9">台词写进镜头段（原生口型同步）· 音色一致挂音频参考 · 虚化人群面部约束照写</text>

  <!-- 9 双模型分支 -->
  <line x1="230" y1="840" x2="230" y2="866" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="840" x2="450" y2="866" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="868" width="280" height="64" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="230" y="890" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Seedance 2.0（豆包/Liblib 免费可及）</text>
  <text x="230" y="908" text-anchor="middle" font-size="11" fill="#475569">单条 4-15 秒 · 镜头编号式「镜头1：…」</text>
  <text x="230" y="924" text-anchor="middle" font-size="11" fill="#B91C1C">不识别时间戳！图≤9+音频3</text>
  <rect x="390" y="868" width="200" height="64" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="490" y="890" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5B21B6">Seedance 2.5（专业版/付费）</text>
  <text x="490" y="908" text-anchor="middle" font-size="11" fill="#475569">单条 4-30 秒 · 时间戳「0-5秒：…」</text>
  <text x="490" y="924" text-anchor="middle" font-size="11" fill="#475569">图≤30 · 草稿480p预览 · 多轮续写</text>
  <line x1="230" y1="932" x2="230" y2="956" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="932" x2="490" y2="956" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="956" x2="340" y2="974" stroke="#64748B" stroke-width="1.5"/>
  <line x1="490" y1="956" x2="340" y2="974" stroke="#64748B" stroke-width="1.5"/>

  <!-- 10 视频生成 -->
  <rect x="80" y="976" width="520" height="76" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="340" y="1000" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">⑨ 视频生成（按所选平台入口操作）</text>
  <text x="340" y="1022" text-anchor="middle" font-size="12" fill="#475569">豆包：新建对话→视频生成 ｜ RunningHub：工作流图槽上传 ｜ LiblibAI：视频创作页选模型</text>
  <text x="340" y="1042" text-anchor="middle" font-size="11.5" fill="#6D28D9">参考图实挂≤8 张最稳 · 分镜图作首帧 · 对话戏一镜一条防口型错乱</text>

  <!-- 11 达标 diamond -->
  <polygon points="340,1070 540,1134 340,1198 140,1134" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <text x="340" y="1130" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">⑩ 画面达标？</text>
  <text x="340" y="1152" text-anchor="middle" font-size="11.5" fill="#4D7C0F">人物一致 · 空间无穿帮 · 口型对</text>
  <path d="M 540 1134 C 630 1134 640 1076 615 1058" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="626" y="1112" text-anchor="middle" font-size="11" fill="#DC2626">否：重新生成指定镜头</text>
  <text x="626" y="1128" text-anchor="middle" font-size="11" fill="#DC2626">2.5 可按秒段编辑</text>
  <line x1="340" y1="1198" x2="340" y2="1216" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="354" y="1212" font-size="11" fill="#16A34A">是</text>

  <!-- 12 成片 -->
  <rect x="80" y="1218" width="520" height="60" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="340" y="1240" text-anchor="middle" font-size="15" font-weight="700" fill="#991B1B">⑪ 成片交付</text>
  <text x="340" y="1262" text-anchor="middle" font-size="12" fill="#475569">多条拼接（剪映）· 钩子帧作尾帧衔接 · 全部文字靠后期字幕</text>
</svg>
